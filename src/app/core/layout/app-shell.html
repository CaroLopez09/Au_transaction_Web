<a class="skip-link" href="#contenido">Saltar al contenido</a>

<header class="topbar">
  <a routerLink="/" class="topbar-logo" aria-label="AU Transactional, inicio">
    <au-logo tone="on-dark" [height]="22" />
  </a>
  <button
    type="button"
    class="menu-toggle"
    aria-controls="navegacion"
    [attr.aria-expanded]="menuOpen()"
    (click)="menuOpen.set(!menuOpen())"
  >
    <au-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="20" />
    <span class="au-visually-hidden">{{ menuOpen() ? 'Cerrar menú' : 'Abrir menú' }}</span>
  </button>
</header>

<nav id="navegacion" class="rail" [class.open]="menuOpen()" aria-label="Principal">
  <a routerLink="/" class="rail-logo" aria-label="AU Transactional, inicio">
    <au-logo tone="on-dark" [height]="30" />
  </a>

  <div class="organization">
    <p class="org-name">{{ organization() }}</p>
    <p class="org-role">{{ roleName() }}</p>
  </div>

  <ul class="items">
    @for (item of items(); track item.path) {
      <li>
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          ariaCurrentWhenActive="page"
        >
          <au-icon [name]="item.icon" />
          {{ item.label }}
        </a>
      </li>
    }
  </ul>

  <div class="account">
    <p class="account-email" [title]="operator()?.email ?? ''">
      <au-icon name="person" [size]="16" />
      <span>{{ operator()?.email }}</span>
    </p>
    <button type="button" class="sign-out" (click)="signOut()">
      <au-icon name="sign-out" [size]="16" />
      Cerrar sesión
    </button>
  </div>
</nav>

<main id="contenido" class="content" tabindex="-1">
  <router-outlet />
</main>
